name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback: typecheck, lint, unit tests, codegen, build ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install

      - name: Typecheck
        run: |
          bun tsc --noEmit
          bun tsc --project plugin/tsconfig.json --noEmit

      - name: Lint
        run: bun run check

      - name: Test
        run: bun test

      - name: Generate Nitrogen bindings
        run: bun run nitrogen

      - name: Build library + plugin
        run: bun run prepare

  # ── React Doctor: fail on ANY warning (requires a perfect score) ──
  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          blocking: warning
          scope: full

  # ── Verify the documentation site builds ──
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('docs/package.json') }}
          restore-keys: bun-docs-${{ runner.os }}-

      - run: bun install

      - name: Build docs
        run: bun run build

  # ── Build the example and run the Maestro E2E flow on iOS ──
  e2e-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the local module
        run: |
          # Retry once with a clean cache: npm/DefinitelyTyped occasionally
          # serves a @types/react tarball whose bytes don't match the stored
          # integrity hash, and this job has no bun cache to fall back on.
          bun install || (bun pm cache rm && bun install)
          bun run nitrogen
          bun run prepare

      - name: Install example dependencies
        working-directory: example
        run: bun install || (bun pm cache rm && bun install)

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('example/package.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Boot simulator
        run: xcrun simctl boot "iPhone 16" || true

      - name: Build & install (Release embeds the JS bundle — no Metro needed)
        working-directory: example
        # --no-bundler: don't start the Metro dev server (the Release build has
        # the bundle embedded). Without it, `expo run:ios` hosts Metro and never
        # returns, hanging the job.
        run: bunx expo run:ios --configuration Release --device "iPhone 16" --no-bundler

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E flow
        working-directory: example
        run: maestro test .maestro/e2e.yaml

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: ~/.maestro/tests
          if-no-files-found: ignore

  # ── Build the example and run the Maestro E2E flow on Android ──
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the local module
        run: |
          bun install
          bun run nitrogen
          bun run prepare

      - name: Install example dependencies
        working-directory: example
        run: bun install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build, boot emulator & run E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The action runs each script line in its own shell, so `cd` must be
          # chained — otherwise expo builds the default app from the repo root
          # and Maestro looks for the flow in the wrong directory. --no-install
          # skips prebuild's dependency-reinstall prompt (fails in CI; gradle
          # resolves from the existing node_modules).
          script: cd example && bunx expo run:android --variant release --no-bundler --no-install && maestro test .maestro/e2e.yaml

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: ~/.maestro/tests
          if-no-files-found: ignore
